<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trance Drum Designer</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #d4d4d4;
            padding: 20px;
            direction: rtl;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: #e8e8e8;
            border: 2px solid #999;
            border-radius: 8px;
            padding: 20px;
        }

        .header {
            text-align: center;
            font-size: 24px;
            font-weight: bold;
            margin-bottom: 20px;
            color: #333;
        }

        .filename-section {
            margin-bottom: 15px;
        }

        .filename-section label {
            display: inline-block;
            margin-left: 10px;
            font-weight: bold;
        }

        .filename-section input {
            padding: 5px;
            width: 250px;
            border: 1px solid #999;
            background: white;
        }

        .canvas-container {
            background: #000;
            border: 2px solid #666;
            margin-bottom: 15px;
            position: relative;
            cursor: crosshair;
            height: 250px;
        }

        canvas {
            display: block;
            width: 100%;
            height: 100%;
        }

        .tabs {
            display: flex;
            gap: 5px;
            margin-bottom: 15px;
        }

        .tab {
            padding: 8px 15px;
            background: #c0c0c0;
            border: 1px solid #999;
            cursor: pointer;
            border-radius: 4px 4px 0 0;
            font-size: 14px;
        }

        .tab.active {
            background: #e8e8e8;
            border-bottom: 2px solid #e8e8e8;
        }

        .controls {
            background: white;
            border: 1px solid #999;
            padding: 15px;
            border-radius: 4px;
        }

        .control-row {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            gap: 15px;
        }

        .control-row label {
            width: 150px;
            font-size: 14px;
        }

        .control-row input[type="range"] {
            flex: 1;
            height: 6px;
        }

        .control-row .value {
            width: 60px;
            text-align: left;
            font-size: 14px;
            font-weight: bold;
        }

        .button-group {
            display: flex;
            gap: 10px;
            margin-top: 15px;
            justify-content: center;
        }

        button {
            padding: 10px 20px;
            background: linear-gradient(to bottom, #f0f0f0, #d0d0d0);
            border: 1px solid #999;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
            font-weight: bold;
        }

        button:hover {
            background: linear-gradient(to bottom, #fff, #e0e0e0);
        }

        button:active {
            background: linear-gradient(to bottom, #d0d0d0, #f0f0f0);
        }

        .info-text {
            text-align: center;
            margin-top: 10px;
            font-size: 12px;
            color: #666;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">🎵 Euphoria Trance Drum Designer</div>

        <div class="filename-section">
            <label>שם קובץ פלט:</label>
            <input type="text" id="filename" value="output.wav">
        </div>

        <div class="canvas-container" id="canvasContainer">
            <canvas id="designCanvas"></canvas>
        </div>

        <div class="tabs">
            <div class="tab active" data-tab="clap">Clap Generator</div>
            <div class="tab" data-tab="noise">Smoke / Noise</div>
            <div class="tab" data-tab="pattern">Pattern/Combo</div>
        </div>

        <div class="controls">
            <div class="control-row">
                <label>משך זמן (שניות):</label>
                <input type="range" id="duration" min="0.1" max="2" step="0.1" value="0.5">
                <span class="value" id="durationValue">0.50</span>
            </div>

            <div class="control-row">
                <label>תדירות (Hz):</label>
                <input type="range" id="frequency" min="50" max="800" step="10" value="200">
                <span class="value" id="frequencyValue">200</span>
            </div>

            <div class="control-row">
                <label>רמת רעש:</label>
                <input type="range" id="noise" min="0" max="100" step="1" value="30">
                <span class="value" id="noiseValue">30</span>
            </div>

            <div class="control-row">
                <label>דעיכה (ms):</label>
                <input type="range" id="decay" min="1" max="100" step="1" value="10">
                <span class="value" id="decayValue">10.00</span>
            </div>

            <div class="control-row">
                <label>רוחב סטריאו:</label>
                <input type="range" id="width" min="0" max="100" step="1" value="50">
                <span class="value" id="widthValue">50</span>
            </div>

            <div class="button-group">
                <button id="playBtn">▶ נגן צליל</button>
                <button id="clearBtn">🗑 נקה עיצוב</button>
                <button id="randomBtn">🎲 אקראי</button>
                <button id="exportBtn">💾 ייצא</button>
            </div>

            <div class="info-text">
                לחץ באזור השחור כדי ליצור נקודות ועצב את האמפליטודה של גל הקול | גרור נקודות לשינוי
            </div>
        </div>
    </div>

    <script>
        // Canvas setup
        const canvas = document.getElementById('designCanvas');
        const ctx = canvas.getContext('2d');
        const container = document.getElementById('canvasContainer');

        // Set canvas size
        function resizeCanvas() {
            canvas.width = container.clientWidth;
            canvas.height = container.clientHeight;
            drawWaveform();
        }
        resizeCanvas();
        window.addEventListener('resize', resizeCanvas);

        // Points for the envelope (amplitude control)
        let points = [
            { x: 0, y: 0.1 },
            { x: 0.05, y: 0.9 },
            { x: 0.3, y: 0.6 },
            { x: 0.7, y: 0.3 },
            { x: 1, y: 0.05 }
        ];

        let selectedPoint = null;
        let isDragging = false;
        let frequency = 200;

        // Get amplitude at position using interpolation
        function getAmplitudeAtX(x) {
            if (x <= points[0].x) return points[0].y;
            if (x >= points[points.length - 1].x) return points[points.length - 1].y;

            for (let i = 0; i < points.length - 1; i++) {
                if (x >= points[i].x && x <= points[i + 1].x) {
                    const t = (x - points[i].x) / (points[i + 1].x - points[i].x);
                    return points[i].y + (points[i + 1].y - points[i].y) * t;
                }
            }
            return 0.5;
        }

        // Draw the waveform
        function drawWaveform() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw grid
            ctx.strokeStyle = '#0a2a0a';
            ctx.lineWidth = 1;
            for (let i = 0; i <= 10; i++) {
                const x = (canvas.width / 10) * i;
                const y = (canvas.height / 10) * i;

                ctx.beginPath();
                ctx.moveTo(x, 0);
                ctx.lineTo(x, canvas.height);
                ctx.stroke();

                ctx.beginPath();
                ctx.moveTo(0, y);
                ctx.lineTo(canvas.width, y);
                ctx.stroke();
            }

            // Draw center line
            ctx.strokeStyle = '#1a4a1a';
            ctx.lineWidth = 2;
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);
            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.stroke();

            // Draw the audio waveform with variable amplitude
            const cycles = (frequency / 1000) * parseFloat(document.getElementById('duration').value) * 8;
            const step = 2;

            // Draw filled waveform
            ctx.fillStyle = 'rgba(0, 255, 0, 0.1)';
            ctx.beginPath();
            ctx.moveTo(0, canvas.height / 2);

            for (let x = 0; x < canvas.width; x += step) {
                const progress = x / canvas.width;
                const amplitude = getAmplitudeAtX(progress);
                const angle = (x / canvas.width) * cycles * Math.PI * 2;
                const wave = Math.sin(angle);
                const y = canvas.height / 2 + (wave * amplitude * canvas.height * 0.45);
                ctx.lineTo(x, y);
            }

            ctx.lineTo(canvas.width, canvas.height / 2);
            ctx.closePath();
            ctx.fill();

            // Draw the waveform line with glow
            ctx.shadowBlur = 15;
            ctx.shadowColor = '#00ff00';
            ctx.strokeStyle = '#00ff00';
            ctx.lineWidth = 2;
            ctx.beginPath();

            for (let x = 0; x < canvas.width; x += step) {
                const progress = x / canvas.width;
                const amplitude = getAmplitudeAtX(progress);
                const angle = (x / canvas.width) * cycles * Math.PI * 2;
                const wave = Math.sin(angle);
                const y = canvas.height / 2 + (wave * amplitude * canvas.height * 0.45);

                if (x === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();

            // Reset shadow
            ctx.shadowBlur = 0;

            // Draw envelope curve (amplitude guide)
            ctx.strokeStyle = '#ffff00';
            ctx.lineWidth = 2;
            ctx.setLineDash([5, 5]);
            ctx.beginPath();

            for (let i = 0; i < points.length; i++) {
                const x = points[i].x * canvas.width;
                const y = canvas.height / 2 - (points[i].y * canvas.height * 0.45);

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();

            // Draw bottom envelope
            ctx.beginPath();
            for (let i = 0; i < points.length; i++) {
                const x = points[i].x * canvas.width;
                const y = canvas.height / 2 + (points[i].y * canvas.height * 0.45);

                if (i === 0) {
                    ctx.moveTo(x, y);
                } else {
                    ctx.lineTo(x, y);
                }
            }
            ctx.stroke();
            ctx.setLineDash([]);

            // Draw control points
            points.forEach((point, index) => {
                const x = point.x * canvas.width;
                const yTop = canvas.height / 2 - (point.y * canvas.height * 0.45);
                const yBottom = canvas.height / 2 + (point.y * canvas.height * 0.45);

                // Draw connection line
                ctx.strokeStyle = 'rgba(255, 255, 0, 0.3)';
                ctx.lineWidth = 1;
                ctx.beginPath();
                ctx.moveTo(x, yTop);
                ctx.lineTo(x, yBottom);
                ctx.stroke();

                // Draw points
                ctx.fillStyle = selectedPoint === index ? '#ff0000' : '#ffff00';
                ctx.beginPath();
                ctx.arc(x, yTop, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.beginPath();
                ctx.arc(x, yBottom, 5, 0, Math.PI * 2);
                ctx.fill();

                ctx.strokeStyle = '#000';
                ctx.lineWidth = 1.5;
                ctx.beginPath();
                ctx.arc(x, yTop, 5, 0, Math.PI * 2);
                ctx.stroke();
                ctx.beginPath();
                ctx.arc(x, yBottom, 5, 0, Math.PI * 2);
                ctx.stroke();
            });
        }

        // Mouse events
        canvas.addEventListener('mousedown', (e) => {
            const rect = canvas.getBoundingClientRect();
            const mouseX = (e.clientX - rect.left) / canvas.width;
            const mouseY = ((e.clientY - rect.top) - canvas.height / 2) / (canvas.height * 0.45);
            const mouseYAbs = Math.abs(mouseY);

            // Check if clicking on existing point
            selectedPoint = null;
            for (let i = 0; i < points.length; i++) {
                const dx = Math.abs(points[i].x - mouseX);
                const dy = Math.abs(points[i].y - mouseYAbs);
                if (dx < 0.03 && dy < 0.1) {
                    selectedPoint = i;
                    isDragging = true;
                    break;
                }
            }

            // Add new point if not clicking on existing
            if (selectedPoint === null) {
                points.push({ x: mouseX, y: mouseYAbs });
                points.sort((a, b) => a.x - b.x);
                drawWaveform();
            }
        });

        canvas.addEventListener('mousemove', (e) => {
            if (isDragging && selectedPoint !== null) {
                const rect = canvas.getBoundingClientRect();
                const mouseX = Math.max(0, Math.min(1, (e.clientX - rect.left) / canvas.width));
                const mouseY = ((e.clientY - rect.top) - canvas.height / 2) / (canvas.height * 0.45);
                const mouseYAbs = Math.max(0, Math.min(1, Math.abs(mouseY)));

                points[selectedPoint].x = mouseX;
                points[selectedPoint].y = mouseYAbs;
                points.sort((a, b) => a.x - b.x);
                drawWaveform();
            }
        });

        canvas.addEventListener('mouseup', () => {
            isDragging = false;
            selectedPoint = null;
            drawWaveform();
        });

        // Control updates
        document.getElementById('duration').addEventListener('input', (e) => {
            document.getElementById('durationValue').textContent = parseFloat(e.target.value).toFixed(2);
            drawWaveform();
        });

        document.getElementById('frequency').addEventListener('input', (e) => {
            frequency = parseInt(e.target.value);
            document.getElementById('frequencyValue').textContent = e.target.value;
            drawWaveform();
        });

        document.getElementById('noise').addEventListener('input', (e) => {
            document.getElementById('noiseValue').textContent = e.target.value;
        });

        document.getElementById('decay').addEventListener('input', (e) => {
            document.getElementById('decayValue').textContent = parseFloat(e.target.value).toFixed(2);
        });

        document.getElementById('width').addEventListener('input', (e) => {
            document.getElementById('widthValue').textContent = e.target.value;
        });

        // Tab switching
        document.querySelectorAll('.tab').forEach(tab => {
            tab.addEventListener('click', () => {
                document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
                tab.classList.add('active');
            });
        });

        // Button actions
        document.getElementById('playBtn').addEventListener('click', () => {
            playSound();
        });

        document.getElementById('clearBtn').addEventListener('click', () => {
            points = [
                { x: 0, y: 0.1 },
                { x: 1, y: 0.1 }
            ];
            drawWaveform();
        });

        document.getElementById('randomBtn').addEventListener('click', () => {
            const numPoints = Math.floor(Math.random() * 4) + 3;
            points = [];
            for (let i = 0; i < numPoints; i++) {
                points.push({
                    x: i / (numPoints - 1),
                    y: Math.random() * 0.7 + 0.2
                });
            }
            drawWaveform();
        });

        document.getElementById('exportBtn').addEventListener('click', () => {
            const filename = document.getElementById('filename').value;
            alert(`ייצוא קובץ: ${filename}\n(דורש הטמעת ייצוא WAV מלא)`);
        });

        // Web Audio API for playing sound
        function playSound() {
            const audioContext = new (window.AudioContext || window.webkitAudioContext)();
            const duration = parseFloat(document.getElementById('duration').value);
            const sampleRate = audioContext.sampleRate;
            const numSamples = duration * sampleRate;
            const buffer = audioContext.createBuffer(1, numSamples, sampleRate);
            const data = buffer.getChannelData(0);

            for (let i = 0; i < numSamples; i++) {
                const progress = i / numSamples;
                const amplitude = getAmplitudeAtX(progress);
                const angle = (i / sampleRate) * frequency * Math.PI * 2;
                data[i] = Math.sin(angle) * amplitude;
            }

            const source = audioContext.createBufferSource();
            source.buffer = buffer;
            source.connect(audioContext.destination);
            source.start();
        }

        // Initial draw
        drawWaveform();
    </script>
</body>
</html>
